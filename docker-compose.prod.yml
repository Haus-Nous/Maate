# ============================================
# MAATE — Production Docker Compose Override
# Usage: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
# ============================================

services:
  postgres:
    environment:
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      POSTGRES_DB: maate_prod
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 4G

  redis:
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD} --maxmemory 1gb --maxmemory-policy allkeys-lru
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G

  # ─── NestJS API (production build) ──────────
  api:
    build:
      context: .
      dockerfile: ./apps/api/Dockerfile
    container_name: maate-api
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}
      - OCR_SERVICE_URL=http://ocr-service:8000
      - AI_SERVICE_URL=http://ai-service:8000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: "1.0"
          memory: 1G

  ocr-service:
    environment:
      - ENVIRONMENT=production
      - LOG_LEVEL=warning
    volumes: []
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G

  ai-service:
    environment:
      - ENVIRONMENT=production
      - LOG_LEVEL=warning
    volumes: []
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G
