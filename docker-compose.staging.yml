# ==============================================================================
# MAATE — Production Staging Stack (docker-compose.staging.yml)
# Private Staging Deployment (Hetzner CX22 / 4GB RAM class or equivalent VPS)
# Reverse Proxy: Caddy with automated TLS (Let's Encrypt / ZeroSSL)
# ==============================================================================

name: maate-staging

services:
  # ─── Reverse Proxy (Caddy) ────────────────────────────────────────────────
  # The ONLY service exposing ports to the public Internet (80/443).
  # Handles TLS certificate issuance and terminates HTTPS.
  caddy:
    image: caddy:2.8-alpine
    container_name: maate-staging-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - maate_staging_net
    depends_on:
      api:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 200M
          cpus: "0.50"

  # ─── PostgreSQL 16 with pgvector ──────────────────────────────────────────
  postgres:
    image: pgvector/pgvector:pg16
    container_name: maate-staging-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_staging_data:/var/lib/postgresql/data
      - ./infrastructure/docker/init-db.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - maate_staging_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 800M
          cpus: "1.0"
        reservations:
          memory: 256M

  # ─── Redis Cache & Bull Queue Store ───────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: maate-staging-redis
    restart: unless-stopped
    command: >
      redis-server 
      --requirepass ${REDIS_PASSWORD}
      --appendonly yes 
      --maxmemory 256mb 
      --maxmemory-policy allkeys-lru
    volumes:
      - redis_staging_data:/data
    networks:
      - maate_staging_net
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 300M
          cpus: "0.50"

  # ─── OCR Microservice (FastAPI + Tesseract) ──────────────────────────────
  ocr-service:
    build:
      context: ./services/ocr-service
      dockerfile: Dockerfile
    container_name: maate-staging-ocr
    restart: unless-stopped
    environment:
      - ENVIRONMENT=staging
      - LOG_LEVEL=info
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/1
      - S3_ENDPOINT=${R2_S3_ENDPOINT}
      - S3_ACCESS_KEY=${R2_ACCESS_KEY_ID}
      - S3_SECRET_KEY=${R2_SECRET_ACCESS_KEY}
      - S3_BUCKET=${R2_BUCKET_NAME}
      - TESSERACT_LANG=eng
    networks:
      - maate_staging_net
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    depends_on:
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 600M
          cpus: "1.0"
        reservations:
          memory: 200M

  # ─── AI Microservice (FastAPI + Sentence-Transformers + Groq) ────────────
  ai-service:
    build:
      context: ./services/ai-service
      dockerfile: Dockerfile
    container_name: maate-staging-ai
    restart: unless-stopped
    environment:
      - ENVIRONMENT=staging
      - LOG_LEVEL=info
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/2
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - GROQ_MODEL=${GROQ_MODEL:-openai/gpt-oss-120b}
    networks:
      - maate_staging_net
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          # Target 4GB server: PyTorch embedding model requires >=1.2GB headroom
          memory: 1500M
          cpus: "1.5"
        reservations:
          memory: 750M

  # ─── NestJS Backend API ──────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: maate-staging-api
    restart: unless-stopped
    environment:
      - NODE_ENV=staging
      - APP_PORT=3000
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - JWT_SECRET=${JWT_SECRET}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET}
      - MFA_ENCRYPTION_KEY=${MFA_ENCRYPTION_KEY}
      - AI_SERVICE_URL=http://ai-service:8000
      - OCR_SERVICE_URL=http://ocr-service:8000
      # Cloudflare R2 S3-Compatible Object Storage
      - S3_ENDPOINT=${R2_S3_ENDPOINT}
      - S3_REGION=auto
      - S3_ACCESS_KEY_ID=${R2_ACCESS_KEY_ID}
      - S3_SECRET_ACCESS_KEY=${R2_SECRET_ACCESS_KEY}
      - S3_BUCKET=${R2_BUCKET_NAME}
      - S3_FORCE_PATH_STYLE=false
      # Staging CORS & Security Restrictions
      - CORS_ORIGINS=${CORS_ORIGINS}
      - ENABLE_DEV_TOOLS=false
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
      - SMTP_FROM=${SMTP_FROM:-Maate Staging <noreply@staging.maate.internal>}
      - SENTRY_DSN=${SENTRY_DSN:-}
    networks:
      - maate_staging_net
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:3000/api/v1/health', (r) => { process.exit(r.statusCode === 200 ? 0 : 1); }).on('error', () => process.exit(1));\""]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 25s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ocr-service:
        condition: service_healthy
      ai-service:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 700M
          cpus: "1.0"
        reservations:
          memory: 256M

networks:
  maate_staging_net:
    driver: bridge

volumes:
  caddy_data:
  caddy_config:
  postgres_staging_data:
  redis_staging_data:
